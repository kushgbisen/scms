{% extends "core/base.html" %}

{% block header %}
<h1>{% if student %}Edit Student{% else %}Add Student{% endif %}</h1>
<p>{% if student %}Update student information{% else %}Create a new student record{% endif %}</p>
{% endblock %}

{% block content %}
<div class="card">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="student_id">Student ID *</label>
                <input type="text" id="student_id" name="student_id" required 
                       value="{% if student %}{{ student.student_id }}{% endif %}" 
                       {% if student %}readonly{% endif %}>
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required 
                       value="{% if student %}{{ student.email }}{% endif %}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="first_name">First Name *</label>
                <input type="text" id="first_name" name="first_name" required 
                       value="{% if student %}{{ student.name.first }}{% endif %}">
            </div>
            <div class="form-group">
                <label for="last_name">Last Name *</label>
                <input type="text" id="last_name" name="last_name" required 
                       value="{% if student %}{{ student.name.last }}{% endif %}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="major">Major *</label>
                <input type="text" id="major" name="major" required 
                       value="{% if student %}{{ student.major }}{% endif %}">
            </div>
            <div class="form-group">
                <label for="year">Year *</label>
                <select id="year" name="year" required>
                    <option value="">Select Year</option>
                    <option value="Freshman" {% if student and student.year == 'Freshman' %}selected{% endif %}>Freshman</option>
                    <option value="Sophomore" {% if student and student.year == 'Sophomore' %}selected{% endif %}>Sophomore</option>
                    <option value="Junior" {% if student and student.year == 'Junior' %}selected{% endif %}>Junior</option>
                    <option value="Senior" {% if student and student.year == 'Senior' %}selected{% endif %}>Senior</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="gpa">GPA *</label>
            <input type="number" id="gpa" name="gpa" step="0.1" min="0" max="4" required 
                   value="{% if student %}{{ student.gpa }}{% endif %}">
        </div>

        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary">
                {% if student %}Update Student{% else %}Add Student{% endif %}
            </button>
            <a href="{{ url_for('students_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
