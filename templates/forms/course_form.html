{% extends "core/base.html" %}

{% block header %}
<h1>{% if course %}Edit Course{% else %}Add Course{% endif %}</h1>
<p>{% if course %}Update course information{% else %}Create a new course record{% endif %}</p>
{% endblock %}

{% block content %}
<div class="card">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="course_code">Course Code *</label>
                <input type="text" id="course_code" name="course_code" required 
                       value="{% if course %}{{ course.course_code }}{% endif %}"
                       {% if course %}readonly{% endif %}>
            </div>
            <div class="form-group">
                <label for="instructor_id">Instructor ID *</label>
                <input type="text" id="instructor_id" name="instructor_id" required 
                       value="{% if course %}{{ course.instructor_id }}{% endif %}">
            </div>
        </div>

        <div class="form-group">
            <label for="title">Course Title *</label>
            <input type="text" id="title" name="title" required 
                   value="{% if course %}{{ course.title }}{% endif %}">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{% if course %}{{ course.description }}{% endif %}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="credits">Credits *</label>
                <input type="number" id="credits" name="credits" min="1" max="6" required 
                       value="{% if course %}{{ course.credits }}{% endif %}">
            </div>
            <div class="form-group">
                <label for="year">Year *</label>
                <input type="number" id="year" name="year" min="2020" max="2030" required 
                       value="{% if course %}{{ course.year }}{% endif %}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="semester">Semester *</label>
                <select id="semester" name="semester" required>
                    <option value="">Select Semester</option>
                    <option value="Fall" {% if course and course.semester == 'Fall' %}selected{% endif %}>Fall</option>
                    <option value="Spring" {% if course and course.semester == 'Spring' %}selected{% endif %}>Spring</option>
                    <option value="Summer" {% if course and course.semester == 'Summer' %}selected{% endif %}>Summer</option>
                </select>
            </div>
            <div class="form-group">
                <label for="prerequisites">Prerequisites</label>
                <input type="text" id="prerequisites" name="prerequisites" 
                       placeholder="e.g., CS101, CS102"
                       value="{% if course and course.prerequisites %}{{ course.prerequisites|join(', ') }}{% endif %}">
                <small style="color: #666;">Enter comma-separated course codes</small>
            </div>
        </div>

        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary">
                {% if course %}Update Course{% else %}Add Course{% endif %}
            </button>
            <a href="{{ url_for('courses_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
